<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171918" />
    <meta name="description" content="Learn together, grow together. Discover peers, share skills and build your next learning path." />
    <title>SkillShare — Learn together. Grow together.</title>
    <script>
      try { const t = localStorage.getItem('skillshare-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body><div id="root"><div class="boot-screen"><span class="brand-mark">s.</span><div class="boot-line"></div></div></div><script type="module" src="/src/main.tsx"></script></body>
</html>
